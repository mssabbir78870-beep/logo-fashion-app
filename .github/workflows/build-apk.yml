name: Build LOGO FASHION APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - run: |
          mkdir -p .build-outputs APK_DOWNLOAD
          cp app/build/outputs/apk/debug/app-debug.apk .build-outputs/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk APK_DOWNLOAD/LOGO-FASHION.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LOGO-FASHION-APK
          path: |
            .build-outputs/app-debug.apk
            APK_DOWNLOAD/LOGO-FASHION.apk
